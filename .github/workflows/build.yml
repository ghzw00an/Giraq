name: Build POI Exporter APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Unzip Project Archive
        run: |
          ZIP_FILE="poi-exporter-android.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Error: $ZIP_FILE not found in the repository!"
            exit 1
          fi
          echo "Extracting $ZIP_FILE..."
          unzip -qo "$ZIP_FILE"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Download RTL text plugin (Arabic shaping)
        run: |
          DIR="./app/src/main/python/poi_exporter/static/vendor"
          mkdir -p "$DIR"
          curl -fsSL https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js -o "$DIR/rtl-text.js" || \
          curl -fsSL https://cdn.jsdelivr.net/npm/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js -o "$DIR/rtl-text.js" || \
          echo "::warning::Failed to download RTL plugin."

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Release APK
        run: gradle assembleRelease -x lint -x lintVitalRelease --no-daemon --build-cache --stacktrace

      # توقيع التطبيق مباشرة بأدوات أندرويد الرسمية مع اكتشاف أحدث إصدار تلقائياً
      - name: Sign Release APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. تحديد أحدث إصدار من أدوات البناء المثبتة على الخادم تلقائياً
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          echo "Using build-tools from: $BUILD_TOOLS_DIR"

          # 2. استخراج ملف المفتاح السري من النص المشفر
          echo "$SIGNING_KEY" | tr -d '[:space:]' | base64 -d > release.keystore

          # 3. العثور على ملف الـ APK غير الموقّع
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"

          # 4. محاذاة الملف (zipalign) وتوقيعه رسمياً (apksigner)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KEY_STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out POIExporter-release-signed.apk \
            app-aligned.apk

          # 5. حذف المفتاح المؤقت بعد انتهاء التوقيع للأمان
          rm -f release.keystore app-aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: POIExporter-Release-${{ github.sha }}
          path: POIExporter-release-signed.apk
          if-no-files-found: error
          retention-days: 7
