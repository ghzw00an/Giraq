name: Build POI Exporter APK

# التشغيل اليدوي فقط
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Unzip Project Archive
        run: |
          ZIP_FILE="poi-exporter-android.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Error: $ZIP_FILE not found in the repository!"
            exit 1
          fi
          echo "Extracting $ZIP_FILE..."
          unzip -qo "$ZIP_FILE"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Download RTL text plugin (Arabic shaping)
        run: |
          DIR="./app/src/main/python/poi_exporter/static/vendor"
          mkdir -p "$DIR"
          curl -fsSL https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js -o "$DIR/rtl-text.js" || \
          curl -fsSL https://cdn.jsdelivr.net/npm/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js -o "$DIR/rtl-text.js" || \
          echo "::warning::Failed to download RTL plugin."

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # بناء النسخة النهائية Release 
      - name: Build Release APK
        run: gradle assembleRelease -x lint -x lintVitalRelease --no-daemon --build-cache --stacktrace

      # توقيع التطبيق باستخدام الأسرار والإصدار الحديث من أدوات البناء
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 34.0.0

      # رفع التطبيق النهائي الموقّع
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: POIExporter-Release-${{ github.sha }}
          path: ${{steps.sign_app.outputs.signedReleaseFile}}
          if-no-files-found: error
          retention-days: 7
