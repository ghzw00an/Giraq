# ضع هذا الملف في المستودع باسم .github/workflows/build.yml (إذا رفعت الملف المضغوط كما هو)
name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q poi-exporter-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Leaflet (offline map files)
        continue-on-error: true
        run: |
          D=poi-exporter-android/app/src/main/python/poi_exporter/static/leaflet
          mkdir -p $D/images
          B=https://unpkg.com/leaflet@1.9.4/dist
          curl -fsSL $B/leaflet.js -o $D/leaflet.js
          curl -fsSL $B/leaflet.css -o $D/leaflet.css
          for f in layers.png layers-2x.png marker-icon.png marker-icon-2x.png marker-shadow.png; do curl -fsSL $B/images/$f -o $D/images/$f; done
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        working-directory: poi-exporter-android
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: POIExporter-debug-apk
          path: poi-exporter-android/app/build/outputs/apk/debug/*.apk
